
name: Pipeline CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cinelista/package-lock.json

      - name: Instalação das dependências
        working-directory: cinelista
        run: npm ci
      
      - name: Rodar o build
        working-directory: cinelista
        run: npm run build
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_IMG_URL }}

  tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
     - name: Instalação das dependências
       working-directory: cinelista
       run: npm ci

     - name: Rodar lint
       working-directory: cinelista
       run: npm run lint
    
     - name: Verificar formatação
       working-directory: cinelista
       run: npm run format
    
     - name: Rodar testes
       working-directory: cinelista
       run: npm run test
