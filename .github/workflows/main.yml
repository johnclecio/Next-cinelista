
# Nome do workflow exibido no GitHub Actions
name: Pipeline CI/CD

# Eventos que disparam o workflow
on:
  push:
    branches:
      - main
    paths:
      - "cinelista/src/**"
      - "cinelista/package.json"
      - "cinelista/package-lock.json"
      - ".github/workflows/**"

  # Permite execução manual pelo GitHub Actions
  workflow_dispatch:

jobs:
  # Primeiro job: build
  build:
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v6

      # Instala o Node.js
      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cinelista/package-lock.json

      # Instala as dependências
      - name: Instalação das dependências
        working-directory: cinelista
        run: npm ci

      # Executa o build do Next.js
      - name: Rodar o build
        working-directory: cinelista
        run: npm run build
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_IMG_URL }}

  # Segundo job: testes e qualidade
  tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v6

      # Instala o Node.js
      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cinelista/package-lock.json

      # Instala as dependências
      - name: Instalação das dependências
        working-directory: cinelista
        run: npm ci

      # Executa o ESLint
      - name: Rodar lint
        working-directory: cinelista
        run: npm run lint

      # Verifica a formatação com Prettier
      - name: Verificar formatação
        working-directory: cinelista
        run: npm run format:check

      # Executa os testes com Jest
      - name: Rodar testes
        working-directory: cinelista
        run: npm run test
# agora
  deploy:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      # Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v6

      # Instala o Node.js
      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Instala o Vercel CLI
      - name: Instalação do Vercel CLI
        run: npm install --global vercel@latest

      # Executa o deploy
      - name: Deploy para Vercel
        working-directory: cinelista
        run: vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  
         
