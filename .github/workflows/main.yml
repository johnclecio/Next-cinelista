
# Nome do workflow exibido no GitHub Actions
name: Pipeline CI/CD

# Eventos que disparam o workflow
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"

  # Permite execução manual pelo GitHub Actions
  workflow_dispatch:

jobs:
  # Primeiro job: build
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm ci

      - name: Rodar o build
        run: npm run build
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_IMG_URL }}

  # Segundo job: testes e qualidade
  tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format -- --check

      - name: Rodar testes
        run: npm run test
