name: Pipeline CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./cinelista

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalação das dependências
        run: npm ci

      - name: Rodar o build
        run: npm run build
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_IMG_URL }}
